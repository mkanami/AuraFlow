name: Linux port

on:
  push:
    paths: ['linuxApp/**', '.github/workflows/linux.yml']
  pull_request:
    paths: ['linuxApp/**', '.github/workflows/linux.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: linuxApp
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: linuxApp/pyproject.toml
      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv xvfb xauth libegl1 libopengl0 libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0
      - name: Install the port
        run: python -m pip install -e '.[gui,dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          bash -n scripts/install.sh
      - name: Core, service, and offscreen GUI regressions
        run: python -m pytest -m 'not x11' -q
      - name: Isolated native X11 playback
        run: xvfb-run -a env AURAFLOW_TEST_X11=1 LIBGL_ALWAYS_SOFTWARE=1 python -m pytest -m x11 -q
      - name: Build wheel and source archive
        run: python -m build
      - name: Verify installed wheel outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/auraflow-wheel"
          "$RUNNER_TEMP/auraflow-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/auraflow-wheel/bin/auraflow" --version
          "$RUNNER_TEMP/auraflow-wheel/bin/auraflow" doctor
      - uses: actions/upload-artifact@v4
        with:
          name: auraflow-linux-python-${{ matrix.python }}
          path: linuxApp/dist/*
