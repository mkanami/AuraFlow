name: Download badge

on:
  schedule:
    - cron: '23 5 * * *'
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out updater
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Check out published badge
        uses: actions/checkout@v4
        with:
          ref: mkkitsune/download-badge
          path: badge

      - name: Read download counts from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 source/.github/scripts/update_download_badge.py --repository "$GITHUB_REPOSITORY" --output badge/downloads.svg

      - name: Publish changed count
        working-directory: badge
        run: |
          git add downloads.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update download count [skip ci]'
          git push origin HEAD:mkkitsune/download-badge
