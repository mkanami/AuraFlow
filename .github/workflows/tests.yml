name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_catalog_smoke:
        description: Run live catalog and browser download smoke tests
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode toolchain
        shell: bash
        run: |
          selected_app="$(ls -td /Applications/Xcode*.app 2>/dev/null | head -n 1 || true)"
          if [[ -n "$selected_app" && -d "$selected_app/Contents/Developer" ]]; then
            echo "DEVELOPER_DIR=$selected_app/Contents/Developer" >> "${GITHUB_ENV}"
          fi
          xcodebuild -version

      - name: Run Swift tests
        working-directory: macOSApp
        run: swift test

      - name: Build portable release targets
        working-directory: macOSApp
        run: |
          swift build -c release --product WallpaperControlApp
          swift build -c release --product AuraWallpaperAgent

      - name: Resolve release binary path
        working-directory: macOSApp
        shell: bash
        run: |
          bin_path="$(swift build -c release --show-bin-path)"
          if [[ ! -x "$bin_path/WallpaperControlApp" ]]; then
            app_binary="$(find .build -type f -path '*/release/WallpaperControlApp' -perm -111 -print -quit)"
            test -n "$app_binary"
            bin_path="$(dirname "$app_binary")"
          fi
          echo "AURAFLOW_RELEASE_BIN=$bin_path" >> "$GITHUB_ENV"

      - name: Verify private framework isolation
        working-directory: macOSApp
        shell: bash
        run: |
          python3 ../.github/scripts/verify_macos_targets.py \
            --package-directory . \
            --source-root Sources/AuraWallpaperCore \
            --source-root Sources/WallpaperControlApp \
            --source-root Sources/AuraWallpaperAgent \
            --binary "WallpaperControlApp=$AURAFLOW_RELEASE_BIN/WallpaperControlApp" \
            --binary "AuraWallpaperAgent=$AURAFLOW_RELEASE_BIN/AuraWallpaperAgent"

      - name: Build native bridge when private framework is available
        working-directory: macOSApp
        shell: bash
        run: |
          macos_major="$(sw_vers -productVersion | cut -d. -f1)"
          if [[ "$macos_major" =~ ^[0-9]+$ && "$macos_major" -ge 26 \
                && -e /System/Library/PrivateFrameworks/Wallpaper.framework/Wallpaper \
                && -e /System/Library/PrivateFrameworks/WallpaperTypes.framework/WallpaperTypes ]]; then
            swift build -c release --product AuraWallpaperNativeBridge
            test -x "$AURAFLOW_RELEASE_BIN/AuraWallpaperNativeBridge"
          else
            echo "Skipping native bridge build: macOS 26 and both private frameworks are required."
          fi

      - name: Stage and ad-hoc sign release app bundle
        working-directory: macOSApp
        shell: bash
        run: |
          bundle_path="$RUNNER_TEMP/AuraFlow.app"
          mkdir -p "$bundle_path/Contents/MacOS" "$bundle_path/Contents/Resources"
          cp "$AURAFLOW_RELEASE_BIN/WallpaperControlApp" "$bundle_path/Contents/MacOS/WallpaperControlApp"
          cp "$AURAFLOW_RELEASE_BIN/AuraWallpaperAgent" "$bundle_path/Contents/MacOS/AuraWallpaperAgent"
          if [[ -x "$AURAFLOW_RELEASE_BIN/AuraWallpaperNativeBridge" ]]; then
            cp "$AURAFLOW_RELEASE_BIN/AuraWallpaperNativeBridge" "$bundle_path/Contents/MacOS/AuraWallpaperNativeBridge"
          fi
          cat > "$bundle_path/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>WallpaperControlApp</string>
            <key>CFBundleIdentifier</key>
            <string>com.andrijvergeles.auraflow.ci</string>
            <key>CFBundleName</key>
            <string>AuraFlow</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$bundle_path/Contents/Info.plist"
          find "$bundle_path/Contents/MacOS" -type f -perm -111 -exec codesign --force --sign - {} \;
          codesign --force --sign - "$bundle_path"
          codesign --verify --deep --strict "$bundle_path"


  deployment-target-macos13:
    name: Portable targets with macOS 13 deployment target
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode toolchain
        shell: bash
        run: |
          selected_app="$(ls -td /Applications/Xcode*.app 2>/dev/null | head -n 1 || true)"
          if [[ -n "$selected_app" && -d "$selected_app/Contents/Developer" ]]; then
            echo "DEVELOPER_DIR=$selected_app/Contents/Developer" >> "${GITHUB_ENV}"
          fi
          sw_vers -productVersion
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Verify package minimum platform
        working-directory: macOSApp
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          package = json.loads(subprocess.check_output(["swift", "package", "dump-package"], text=True))
          platforms = {
              entry["platformName"]: entry["version"]
              for entry in package.get("platforms", [])
          }
          assert platforms.get("macos") == "13.0", platforms
          print(f"SwiftPM macOS platform: {platforms['macos']}")
          PY

      - name: Build portable production targets for macOS 13
        working-directory: macOSApp
        shell: bash
        run: |
          swift build -c release --target AuraWallpaperCore
          swift build -c release --product WallpaperControlApp
          swift build -c release --product AuraWallpaperAgent

      - name: Verify deployment target and private framework isolation
        working-directory: macOSApp
        shell: bash
        run: |
          bin_path="$(swift build -c release --show-bin-path)"
          test -x "$bin_path/WallpaperControlApp"
          test -x "$bin_path/AuraWallpaperAgent"
          python3 ../.github/scripts/verify_macos_targets.py \
            --package-directory . \
            --source-root Sources/AuraWallpaperCore \
            --source-root Sources/WallpaperControlApp \
            --source-root Sources/AuraWallpaperAgent \
            --binary "WallpaperControlApp=$bin_path/WallpaperControlApp" \
            --binary "AuraWallpaperAgent=$bin_path/AuraWallpaperAgent" \
            --deployment-major 13

      - name: Build and verify legacy Screen Saver for macOS 13
        shell: bash
        run: |
          legacy_output="$RUNNER_TEMP/AuraFlow-legacy-screen-saver"
          MACOSX_DEPLOYMENT_TARGET=13.0 \
            BUILD_UNIVERSAL=0 \
            REQUIRE_UNIVERSAL=0 \
            ./scripts/build_screensaver.sh "$legacy_output"
          legacy_binary="$legacy_output/AuraFlowLockScreen.saver/Contents/MacOS/AuraFlowLockScreen"
          test -x "$legacy_binary"
          python3 .github/scripts/verify_macos_targets.py \
            --package-directory macOSApp \
            --binary "AuraFlowLockScreen=$legacy_binary" \
            --deployment-major 13


  swift6-strict-concurrency:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode toolchain
        shell: bash
        run: |
          selected_app="$(ls -td /Applications/Xcode*.app 2>/dev/null | head -n 1 || true)"
          if [[ -n "$selected_app" && -d "$selected_app/Contents/Developer" ]]; then
            echo "DEVELOPER_DIR=$selected_app/Contents/Developer" >> "${GITHUB_ENV}"
          fi
          xcodebuild -version

      - name: Build production targets with Swift 6 strict concurrency
        working-directory: macOSApp
        shell: bash
        run: |
          strict_flags=(
            -Xswiftc -swift-version -Xswiftc 6
            -Xswiftc -strict-concurrency=complete
            -Xswiftc -warnings-as-errors
          )
          swift build --target AuraWallpaperCore "${strict_flags[@]}"
          swift build --target WallpaperControlApp "${strict_flags[@]}"
          swift build --target AuraWallpaperAgent "${strict_flags[@]}"
          macos_major="$(sw_vers -productVersion | cut -d. -f1)"
          if [[ "$macos_major" =~ ^[0-9]+$ && "$macos_major" -ge 26 \
                && -e /System/Library/PrivateFrameworks/Wallpaper.framework/Wallpaper \
                && -e /System/Library/PrivateFrameworks/WallpaperTypes.framework/WallpaperTypes ]]; then
            swift build --target AuraWallpaperNativeBridge "${strict_flags[@]}"
          else
            echo "Skipping strict native bridge build: macOS 26 and both private frameworks are required."
          fi


  native-bridge-smoke:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode toolchain
        shell: bash
        run: |
          selected_app="$(ls -td /Applications/Xcode*.app 2>/dev/null | head -n 1 || true)"
          if [[ -n "$selected_app" && -d "$selected_app/Contents/Developer" ]]; then
            echo "DEVELOPER_DIR=$selected_app/Contents/Developer" >> "${GITHUB_ENV}"
          fi
          xcodebuild -version

      - name: Build native bridge
        working-directory: macOSApp
        shell: bash
        run: |
          macos_major="$(sw_vers -productVersion | cut -d. -f1)"
          if [[ ! "$macos_major" =~ ^[0-9]+$ || "$macos_major" -lt 26 \
                || ! -e /System/Library/PrivateFrameworks/Wallpaper.framework/Wallpaper \
                || ! -e /System/Library/PrivateFrameworks/WallpaperTypes.framework/WallpaperTypes ]]; then
            echo "Skipping native bridge smoke: macOS 26 and both private frameworks are required."
            exit 0
          fi
          swift build -c release --product AuraWallpaperNativeBridge

      - name: Run native bridge JSON protocol smoke test
        working-directory: macOSApp
        shell: bash
        run: |
          macos_major="$(sw_vers -productVersion | cut -d. -f1)"
          if [[ ! "$macos_major" =~ ^[0-9]+$ || "$macos_major" -lt 26 \
                || ! -e /System/Library/PrivateFrameworks/Wallpaper.framework/Wallpaper \
                || ! -e /System/Library/PrivateFrameworks/WallpaperTypes.framework/WallpaperTypes ]]; then
            echo "Skipping native bridge smoke: macOS 26 and both private frameworks are required."
            exit 0
          fi
          bridge_path="$(find .build -type f -path '*/release/AuraWallpaperNativeBridge' -perm -111 -print -quit)"
          test -n "$bridge_path"
          if ! otool -L "$bridge_path" | grep -Eq '/Wallpaper\.framework'; then
            echo "AuraWallpaperNativeBridge is missing Wallpaper.framework linkage: $bridge_path" >&2
            exit 1
          fi
          if ! otool -L "$bridge_path" | grep -Eq '/WallpaperTypes\.framework'; then
            echo "AuraWallpaperNativeBridge is missing WallpaperTypes.framework linkage: $bridge_path" >&2
            exit 1
          fi
          python3 ../scripts/native_bridge_smoke.py "$bridge_path"

  live-catalog-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_catalog_smoke == true
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode toolchain
        shell: bash
        run: |
          selected_app="$(ls -td /Applications/Xcode*.app 2>/dev/null | head -n 1 || true)"
          if [[ -n "$selected_app" && -d "$selected_app/Contents/Developer" ]]; then
            echo "DEVELOPER_DIR=$selected_app/Contents/Developer" >> "${GITHUB_ENV}"
          fi
          xcodebuild -version

      - name: Run opt-in live catalog smoke tests
        working-directory: macOSApp
        env:
          AURAFLOW_LIVE_CATALOG_SMOKE: "1"
          AURAFLOW_LIVE_CATALOG_SAMPLE: "3"
          AURAFLOW_LIVE_BROWSER_DOWNLOAD_SMOKE: "1"
        run: swift test --filter liveCatalogDownloadSmoke

      - name: Run opt-in browser download smoke test
        working-directory: macOSApp
        env:
          AURAFLOW_LIVE_BROWSER_DOWNLOAD_SMOKE: "1"
        run: swift test --filter liveMoeWallsBrowserDownloadSmoke
