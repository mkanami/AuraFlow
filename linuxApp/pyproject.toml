[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "auraflow-linux"
version = "0.2.0"
description = "AuraFlow live wallpapers for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "python-xlib>=0.33,<1; sys_platform == 'linux'",
    "beautifulsoup4>=4.12,<5",
    "pyte>=0.8.2,<1",
    "Pillow>=10.4,<13",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
auraflow = "auraflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auraflow = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["x11: isolated X11 integration (AURAFLOW_TEST_X11=1)"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
